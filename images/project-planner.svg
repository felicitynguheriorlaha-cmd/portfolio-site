<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Academic Planner application preview">
  <defs>
    <linearGradient id="silver-head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#d4dbe2"/>
      <stop offset="100%" stop-color="#8a97a5"/>
    </linearGradient>
    <linearGradient id="progress-bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84919e"/>
      <stop offset="100%" stop-color="#e6edf3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="440" fill="#0b0e12"/>

  <!-- Planner Container Frame -->
  <rect x="20" y="20" width="600" height="400" rx="14" fill="#11161c" stroke="#252d37" stroke-width="1.5"/>

  <!-- App Header -->
  <text x="44" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#8795a5" letter-spacing="2">STAY ON TOP OF YOUR STUDIES</text>
  <text x="44" y="90" font-family="'Oswald', Impact, -apple-system, sans-serif" font-size="28" font-weight="800" fill="url(#silver-head)" letter-spacing="1">ACADEMIC PLANNER</text>

  <!-- Left Column: Form & Task List (Width ~360) -->
  <g transform="translate(44, 110)">
    <!-- Task Form Panel -->
    <rect width="360" height="66" rx="8" fill="#161c23" stroke="#27313c" stroke-width="1"/>
    
    <!-- Input Field Mockup -->
    <rect x="12" y="14" width="168" height="38" rx="6" fill="#0d1217" stroke="#333e4c" stroke-width="1"/>
    <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#677584">e.g. Finish COS 106...</text>
    
    <!-- Course Select -->
    <rect x="188" y="14" width="70" height="38" rx="6" fill="#0d1217" stroke="#333e4c" stroke-width="1"/>
    <text x="198" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c4cdd6">COS 106</text>
    <polygon points="248,35 252,40 244,40" fill="#8795a5"/>

    <!-- Add Button -->
    <rect x="266" y="14" width="82" height="38" rx="6" fill="#e6edf3"/>
    <text x="281" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0b0e12">+ Add</text>

    <!-- Filters Row -->
    <g transform="translate(0, 82)">
      <rect x="0" y="0" width="46" height="24" rx="12" fill="#e6edf3"/>
      <text x="14" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0b0e12">All</text>

      <rect x="52" y="0" width="60" height="24" rx="12" fill="#161d24" stroke="#2b3644"/>
      <text x="64" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8d9baa">Active</text>

      <rect x="118" y="0" width="82" height="24" rx="12" fill="#161d24" stroke="#2b3644"/>
      <text x="128" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8d9baa">Completed</text>
    </g>

    <!-- Task List Items -->
    <!-- Task Item 1 (Done) -->
    <g transform="translate(0, 120)">
      <rect width="360" height="48" rx="8" fill="#141920" stroke="#222b35" stroke-width="1"/>
      <!-- Checkbox (checked) -->
      <circle cx="26" cy="24" r="9" fill="#e6edf3"/>
      <path d="M22 24 L25 27 L30 20" stroke="#0b0e12" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#677584" text-decoration="line-through">COS 106 Portfolio Project</text>
      <!-- Course tag -->
      <rect x="238" y="15" width="56" height="18" rx="9" fill="#1c242e"/>
      <text x="246" y="28" font-family="monospace" font-size="9" fill="#9eb0c2">COS 106</text>
      <!-- Priority -->
      <rect x="300" y="15" width="48" height="18" rx="9" fill="#2b1b1b" stroke="#662d2d" stroke-width="0.8"/>
      <text x="308" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#e27c7c">HIGH</text>
    </g>

    <!-- Task Item 2 (Active) -->
    <g transform="translate(0, 176)">
      <rect width="360" height="48" rx="8" fill="#171e26" stroke="#2b3644" stroke-width="1"/>
      <!-- Checkbox (unchecked) -->
      <circle cx="26" cy="24" r="9" fill="#0d1217" stroke="#4a596b" stroke-width="1.5"/>
      <text x="46" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#f0f4f8">GST 111 Assignment 2</text>
      <!-- Course tag -->
      <rect x="238" y="15" width="56" height="18" rx="9" fill="#1f2834"/>
      <text x="247" y="28" font-family="monospace" font-size="9" fill="#9eb0c2">GST 111</text>
      <!-- Priority -->
      <rect x="300" y="15" width="48" height="18" rx="9" fill="#2b261a" stroke="#63532b" stroke-width="0.8"/>
      <text x="310" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#dec477">MED</text>
    </g>
  </g>

  <!-- Right Column: Summary Panel (Width ~170) -->
  <g transform="translate(424, 110)">
    <rect width="172" height="276" rx="10" fill="#141a22" stroke="#26313d" stroke-width="1.2"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Summary</text>
    
    <line x1="20" y1="46" x2="152" y2="46" stroke="#222b37" stroke-width="1"/>

    <!-- Row Total -->
    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8795a5">Total tasks</text>
    <text x="140" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">2</text>

    <!-- Row Pending -->
    <text x="20" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8795a5">Pending</text>
    <text x="140" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">1</text>

    <!-- Row Completed -->
    <text x="20" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8795a5">Completed</text>
    <text x="140" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">1</text>

    <line x1="20" y1="154" x2="152" y2="154" stroke="#222b37" stroke-width="1"/>

    <!-- Progress -->
    <text x="20" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#8795a5">Progress</text>
    <text x="140" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e6edf3" text-anchor="end">50%</text>

    <rect x="20" y="192" width="132" height="6" rx="3" fill="#202732"/>
    <rect x="20" y="192" width="66" height="6" rx="3" fill="url(#progress-bar-grad)"/>

    <!-- Clear Completed Button -->
    <rect x="20" y="222" width="132" height="32" rx="6" fill="#1b222c" stroke="#313d4b" stroke-width="1"/>
    <text x="44" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#cfd6dd">Clear Completed</text>
  </g>
</svg>

